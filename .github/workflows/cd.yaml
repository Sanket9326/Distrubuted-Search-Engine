name: Publish images and update GitOps

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-master
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: sanket9326/document-search-platform

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: document-ingestion-service
            dockerfile: src/Services/DocumentIngestionService/Dockerfile
          - service: embedding-service
            dockerfile: src/Services/EmbeddingService/Dockerfile
          - service: keyword-index-service
            dockerfile: src/Services/KeywordIndexService/Dockerfile
          - service: reliability-service
            dockerfile: src/Services/ReliabilityService/Dockerfile
          - service: search-service
            dockerfile: src/Services/SearchService/Dockerfile
          - service: upload-service
            dockerfile: src/Services/UploadService/Dockerfile
          - service: web-ui
            dockerfile: src/Services/WebUI/Dockerfile

    steps:
      - name: Check out CI-tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=publish-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service }}

  update-helm-tags:
    name: Update Helm image tags
    needs: publish
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Update application image tags
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          values_files=(
            deploy/helm/document-ingestion-service/values.yaml
            deploy/helm/embedding-service/values.yaml
            deploy/helm/keyword-index-service/values.yaml
            deploy/helm/reliability-service/values.yaml
            deploy/helm/search-service/values.yaml
            deploy/helm/upload-service/values.yaml
            deploy/helm/web-ui/values.yaml
          )

          for values_file in "${values_files[@]}"; do
            sed -i -E "s/^([[:space:]]*tag:[[:space:]]*).*/\1\"${IMAGE_TAG}\"/" "$values_file"
          done

      - name: Commit and push Helm tag update
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/*/values.yaml

          if git diff --cached --quiet; then
            echo "Helm image tags are already up to date."
            exit 0
          fi

          git commit -m "chore: publish images ${IMAGE_TAG}"
          git push origin HEAD:master
