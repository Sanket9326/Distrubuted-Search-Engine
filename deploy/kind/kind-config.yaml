#test ci
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: search-engine
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Host port 80/443 are unusable on this machine (Windows reserves them
      # via netsh's excluded port range, a Hyper-V/WSL2 quirk) - using 8080/8443
      # instead. Reach the ingress at http://search.local:8080.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
