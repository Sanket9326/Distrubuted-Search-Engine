replicaCount: 1

image:
  repository: ghcr.io/sanket9326/document-search-platform/document-ingestion-service
  tag: "f50a1c34a2ae12357af152ffe0bf7a2c3ed503c5"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

probes:
  readinessPath: /health
  livenessPath: /health/live

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

# Non-secret configuration, mounted as env vars via a ConfigMap.
config:
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Kafka__BootstrapServers: kafka:29092
  Kafka__GroupId: document-ingestion-service
  Minio__Endpoint: minio:9000
  Minio__BucketName: documents
  Minio__UseSSL: "false"
  Redis__ConnectionString: redis:6379

# Sensitive configuration, mounted as env vars via a Secret.
# Values below are the non-production local-dev defaults (see .env.example).
# For staging/production, override with --set, a separate (gitignored)
# values file, or an external secrets manager — do NOT reuse these values.
secrets:
  Postgres__ConnectionString: "Host=postgres;Port=5432;Database=documentsearch;Username=documentsearch;Password=changeme"
  Minio__AccessKey: "minioadmin"
  Minio__SecretKey: "changeme"
