replicaCount: 1

image:
  repository: ghcr.io/sanket9326/document-search-platform/reliability-service
  tag: "acb59d9"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

probes:
  readinessPath: /health
  livenessPath: /health/live

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

# Non-secret configuration, mounted as env vars via a ConfigMap.
config:
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Kafka__BootstrapServers: kafka:29092
  Redis__ConnectionString: redis:6379

# No credentials required by this service today, so no Secret is rendered.
# Add keys here (and override with --set / a secrets manager) if that changes.
secrets: {}
