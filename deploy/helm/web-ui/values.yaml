replicaCount: 1

image:
  repository: ghcr.io/sanket9326/document-search-platform/web-ui
  tag: "fc4e92f8abfc04bae87b9d4843fb4fe668c3adc7"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

probes:
  readinessPath: /health
  livenessPath: /health

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: nginx
  # Local kind cluster: map this to 127.0.0.1 in your hosts file
  # (C:\Windows\System32\drivers\etc\hosts on Windows) to reach it.
  host: search.local
  annotations: {}

# web-ui is a static Angular build served by nginx (API URLs are baked in at
# build time) — no runtime env vars are needed, so no ConfigMap/Secret is rendered.
config: {}
secrets: {}
