global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: upload-service
    metrics_path: /metrics
    static_configs:
      - targets: ["upload-service-upload-service:8080"]

  - job_name: document-ingestion-service
    metrics_path: /metrics
    static_configs:
      - targets: ["document-ingestion-service-document-ingestion-service:8080"]

  - job_name: embedding-service
    metrics_path: /metrics
    static_configs:
      - targets: ["embedding-service-embedding-service:8080"]

  - job_name: keyword-index-service
    metrics_path: /metrics
    static_configs:
      - targets: ["keyword-index-service-keyword-index-service:8080"]

  - job_name: search-service
    metrics_path: /metrics
    static_configs:
      - targets: ["search-service-search-service:8080"]

  - job_name: reliability-service
    metrics_path: /metrics
    static_configs:
      - targets: ["reliability-service-reliability-service:8080"]
