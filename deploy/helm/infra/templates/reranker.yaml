apiVersion: apps/v1
kind: Deployment
metadata:
  name: reranker
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app: reranker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reranker
  template:
    metadata:
      labels:
        app: reranker
    spec:
      # TEI reads PROMETHEUS_PORT as a numeric CLI setting.  Kubernetes service
      # links would inject it as e.g. tcp://<service-ip>:9090 because this chart
      # also creates a Prometheus Service, causing TEI to exit during startup.
      enableServiceLinks: false
      containers:
        - name: reranker
          image: "{{ .Values.reranker.image }}:{{ .Values.reranker.tag }}"
          args: ["--model-id", "{{ .Values.reranker.modelId }}"]
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /health
              port: 80
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.reranker.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reranker
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  selector:
    app: reranker
  ports:
    - port: 80
      targetPort: 80
      name: http
