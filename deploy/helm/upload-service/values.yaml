replicaCount: 1

image:
  repository: ghcr.io/sanket9326/document-search-platform/upload-service
  tag: "acb59d9"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

probes:
  readinessPath: /health
  livenessPath: /health/live

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

# Non-secret configuration, mounted as env vars via a ConfigMap.
config:
  ASPNETCORE_ENVIRONMENT: Production
  Kafka__BootstrapServers: kafka:29092
  Minio__Endpoint: minio:9000
  Minio__BucketName: documents
  Minio__UseSSL: "false"
  Cors__WebUiOrigin: http://web-ui

# Sensitive configuration, mounted as env vars via a Secret.
# Values below are the non-production local-dev defaults (see .env.example).
# For staging/production, override with --set, a separate (gitignored)
# values file, or an external secrets manager — do NOT reuse these values.
secrets:
  Minio__AccessKey: "minioadmin"
  Minio__SecretKey: "changeme"
