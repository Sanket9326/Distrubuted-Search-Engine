replicaCount: 1

image:
  repository: ghcr.io/sanket9326/document-search-platform/search-service
  tag: "fd31c18"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

probes:
  readinessPath: /health
  livenessPath: /health/live

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

# Non-secret configuration, mounted as env vars via a ConfigMap.
config:
  ASPNETCORE_ENVIRONMENT: Production
  Qdrant__Endpoint: qdrant
  Qdrant__Port: "6334"
  Qdrant__CollectionName: document_chunks
  Ollama__Endpoint: http://ollama:11434
  Ollama__Model: nomic-embed-text
  Reranker__Endpoint: http://reranker:80
  Gemini__Endpoint: https://generativelanguage.googleapis.com/v1beta/
  Gemini__Model: gemini-flash-lite-latest
  Cors__WebUiOrigin: http://web-ui

# Sensitive configuration, mounted as env vars via a Secret.
# Postgres value below is the non-production local-dev default (see .env.example).
# Gemini__ApiKey has no safe dev default (it's a real external API key) and
# must always be supplied at deploy time — never commit a real key here.
# For staging/production, override with --set, a separate (gitignored)
# values file, or an external secrets manager.
secrets:
  Gemini__ApiKey: ""
  Postgres__ConnectionString: "Host=postgres;Port=5432;Database=documentsearch;Username=documentsearch;Password=changeme"

# Set by local Kind bootstrap or an external secret manager. When populated,
# the chart references this Secret and does not manage or overwrite it.
existingSecret: ""
