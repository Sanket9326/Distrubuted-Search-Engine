apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-service
  namespace: argocd
spec:
  project: search-engine
  source:
    repoURL: https://github.com/Sanket9326/Distrubuted-Search-Engine.git
    targetRevision: master
    path: deploy/helm/search-service
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: existingSecret
          value: search-service-runtime-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: search-engine
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
