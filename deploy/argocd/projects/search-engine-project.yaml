apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: search-engine
  namespace: argocd
spec:
  description: Distributed Search Engine microservices (monorepo)
  sourceRepos:
    - https://github.com/Sanket9326/Distrubuted-Search-Engine.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: search-engine
  clusterResourceWhitelist:
    # Namespace is cluster-scoped, and Applications use CreateNamespace=true
    # to create search-engine on first sync - everything else cluster-scoped
    # (ClusterRole, CRDs, etc.) stays denied.
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
